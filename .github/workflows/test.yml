name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  Test:
    strategy:
      matrix:
        # remove windows tests until https://github.com/npm/cli/issues/4234 is fixed
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, macos-latest]
        node_version: [20, "lts/*", node]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests 👩🏽‍💻
        run: npm test

  Lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run lint

  Release:
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    needs: [Test, Lint]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Dependencies
        run: npm ci
      - name: Verify Signatures
        run: npm audit signatures
      - name: Current Version
        id: current
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx \
            --package semantic-release@25 \
            --package @semantic-release/changelog@7 \
            --package @semantic-release/git@11 \
            semantic-release
      # @semantic-release/npm bumps package.json only when a release is made
      - name: Check Release
        id: semantic_release
        env:
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$PREVIOUS_VERSION" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish coffeelint.github.io
        if: steps.semantic_release.outputs.new_release_published == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: coffeelint/coffeelint.github.io
          event-type: compile
          client-payload: '{"coffeelint_version": "${{ steps.semantic_release.outputs.new_release_version }}"}'
